name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest backend/tests -q

      # The demo's whole claim is that a given seed reproduces a given corpus.
      # Regenerate it here and fail if anything moved: this catches a generator
      # change that silently invalidates the checked-in corpus or its cached prose.
      - name: Corpus is reproducible from its seed
        run: |
          python -m intake.db.seed --db "${RUNNER_TEMP}/ci.sqlite3"
          git diff --exit-code -- data/corpus.json data/naturalized.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --noEmit

      # The span segmenter is the only real logic on this side, and it shipped
      # three bugs in a row -- each one leaving some field's evidence invisible.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
